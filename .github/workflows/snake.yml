name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Monochrome Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chxe01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#333333&color_dots=#eeeeee,#cccccc,#999999,#666666,#333333
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#111111,#333333,#555555,#777777,#aaaaaa

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
