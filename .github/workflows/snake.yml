name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Monochrome Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chxe01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23222222&color_dots=%23eeeeee,%23cccccc,%23999999,%23666666,%23333333
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%23111111,%23333333,%23555555,%23777777,%23aaaaaa

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
